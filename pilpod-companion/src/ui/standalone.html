<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PilPod</title>
  <link rel="stylesheet" href="standalone.css" />
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <header class="header">
    <div class="brand">
      <img src="../../icons/icon48.png" alt="" class="logo" width="20" height="20" />
      <span class="title">PilPod</span>
    </div>
    <div class="header-right">
      <button id="btnRefresh" class="icon-btn" title="Refresh tabs">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
    </div>
  </header>

  <!-- ── Search ──────────────────────────────────────────────────────────── -->
  <div class="search-wrap" id="searchWrap">
    <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="search" placeholder="Search tabs… (Enter to jump)" autocomplete="off" spellcheck="false" />
    <kbd class="shortcut-hint">⌘K</kbd>
  </div>

  <!-- ── Main nav tabs ───────────────────────────────────────────────────── -->
  <div class="tabs-nav">
    <button class="tab-btn active" data-view="audio">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      Audio
      <span id="audioCount" class="badge">0</span>
    </button>
    <button class="tab-btn" data-view="all">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      All Tabs
      <span id="allCount" class="badge">0</span>
    </button>
    <button class="tab-btn" data-view="controls">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
      Controls
    </button>
  </div>

  <!-- ── Tab list (audio / all) ──────────────────────────────────────────── -->
  <div id="tabList" class="tab-list"></div>

  <!-- ── Empty state ─────────────────────────────────────────────────────── -->
  <div id="emptyState" class="empty-state hidden">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
    <p id="emptyMsg">No audio tabs right now</p>
  </div>

  <!-- ── Error banner ─────────────────────────────────────────────────────── -->
  <p id="errorMsg" class="error hidden" role="alert"></p>

  <!-- ═══════════════════════════════════════════════════════════════════════
       CONTROLS PANEL (Feature-01)
  ════════════════════════════════════════════════════════════════════════════ -->
  <div id="controlsPanel" class="controls-panel hidden">

    <!-- 1. Active tab media player ────────────────────────────────────────── -->
    <section class="ctrl-section">
      <div class="ctrl-section-head">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
        <span>Active Tab Media</span>
        <div class="media-status-dot" id="mediaStatusDot"></div>
      </div>

      <!-- Seekbar -->
      <div id="seekbarWrap" class="seekbar-wrap">
        <span id="seekCurrent" class="seek-time">0:00</span>
        <div class="seekbar-track" id="seekbarTrack">
          <div class="seekbar-fill" id="seekbarFill"></div>
          <input id="seekSlider" type="range" class="seekbar-input" min="0" max="1000" value="0" step="1" />
        </div>
        <span id="seekDuration" class="seek-time">0:00</span>
      </div>

      <div id="noMediaMsg" class="no-media-msg hidden">No video or audio detected on active tab</div>

      <!-- Transport row -->
      <div class="transport-row">
        <!-- Prev track -->
        <button class="transport-btn" id="btnPrev" title="Previous track">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
        </button>
        <!-- Skip Ad -->
        <button class="transport-btn skip-ad-btn" id="btnSkipAd" title="Skip ad" disabled>
          <span class="skip-ad-icon">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
          </span>
          <span id="skipAdLabel">No Ad</span>
          <span id="skipAdCountdown" class="skip-countdown hidden"></span>
        </button>
        <!-- PiP -->
        <button class="transport-btn pip-btn" id="btnPip" title="Picture-in-Picture">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><rect x="12" y="11" width="9" height="6" rx="1"/></svg>
          <span>PiP</span>
        </button>
        <!-- Next track -->
        <button class="transport-btn" id="btnNext" title="Next track">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
      </div>

      <!-- Feedback toast -->
      <div id="ctrlToast" class="ctrl-toast hidden"></div>
    </section>

    <!-- 2. Global broadcast controls ─────────────────────────────────────── -->
    <section class="ctrl-section">
      <div class="ctrl-section-head">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span>Global Broadcast</span>
      </div>

      <div class="global-btns">

        <!-- Mute All -->
        <button class="global-btn" id="btnMuteAll">
          <div class="global-btn-icon mute-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
          </div>
          <div class="global-btn-text">
            <span class="global-btn-label">Mute All</span>
            <span class="global-btn-sub">Silence every playing tab</span>
          </div>
          <div class="global-btn-badge" id="muteAllState">OFF</div>
        </button>

        <!-- Pause All -->
        <button class="global-btn" id="btnPauseAll">
          <div class="global-btn-icon pause-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </div>
          <div class="global-btn-text">
            <span class="global-btn-label">Pause All</span>
            <span class="global-btn-sub">Freeze all media browser-wide</span>
          </div>
          <div class="global-btn-badge" id="pauseAllState">OFF</div>
        </button>

        <!-- Reset All Volumes -->
        <button class="global-btn reset-btn" id="btnResetVolumes">
          <div class="global-btn-icon reset-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>
          </div>
          <div class="global-btn-text">
            <span class="global-btn-label">Reset All Volumes</span>
            <span class="global-btn-sub">Drop all boosts back to 100%</span>
          </div>
          <div class="global-btn-badge reset-badge" id="resetState">—</div>
        </button>

      </div>
    </section>

  </div>
  <!-- /controlsPanel -->

  <!-- ── Volume panel (slide-up sheet) ──────────────────────────────────── -->
  <div id="volumePanel" class="volume-panel hidden">
    <div class="volume-panel-header">
      <span id="volumePanelTitle" class="volume-panel-label">Volume</span>
      <button id="volumePanelClose" class="icon-btn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="volume-slider-wrap">
      <span class="vol-label">0%</span>
      <input id="volumeSlider" type="range" min="0" max="6" step="0.05" value="1" />
      <span id="volDisplay" class="vol-label vol-val">100%</span>
    </div>
    <div class="volume-presets">
      <button class="preset-btn" data-vol="0.5">50%</button>
      <button class="preset-btn" data-vol="1">100%</button>
      <button class="preset-btn" data-vol="1.5">150%</button>
      <button class="preset-btn" data-vol="2">200%</button>
      <button class="preset-btn" data-vol="3">300%</button>
      <button class="preset-btn" data-vol="6">600%</button>
    </div>
  </div>

  <script type="module" src="standalone.js"></script>
</body>
</html>
