<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Match the app's theme before first paint. Both windows share an origin,
      // so this is the same key the dashboard writes — no flash of the wrong
      // appearance while the module graph loads.
      try {
        var v = localStorage.getItem("pilpod-theme");
        var isDark = v !== "light";
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
      } catch (_) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PilPod Widget</title>
    <style>
      /* The window is transparent and undecorated: only the triangle should
         ever paint. A default body background would render as an opaque square
         over the user's desktop. */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <!--
      One surface, and no UI framework behind it: the chip is plain DOM driven
      by `widget-main.ts`. Clicking it opens the dashboard, so there is nothing
      else for this document to host.
    -->
    <div id="chip"></div>
    <script type="module" src="/src/widget-main.ts"></script>
  </body>
</html>
